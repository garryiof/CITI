[project]
name = "policy-knowledge-poc"
version = "0.1.0"
description = "One-policy JupyterHub POC: DOCX/PDF/HTML → canonical model → OKF + BPMN + offline demo"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary — internal POC" }
authors = [{ name = "Policy Intelligence POC" }]

[project.optional-dependencies]
# Inventory only — do not pip-install from this file in JupyterHub without approval.
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "notebooks"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
